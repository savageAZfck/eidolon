[package]
name = "eidolon"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/eidolon"
homepage = "https://github.com/savageAZfck/eidolon"
license = "MIT"
description = "Counterfactual replay for audited agents: fork a hash-chained history, replay it under an alternate policy, and sign the divergence — provable what-would-have-happened for sovereign organisms"
keywords = ["counterfactual", "replay", "audit", "policy", "agents"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"

[features]
default = []
